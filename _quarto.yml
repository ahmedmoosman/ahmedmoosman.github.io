project:
  output-dir: _site       # built by GitHub Actions; not committed
  render:
    - index.qmd
  resources:
    - styles.css
    - script.js
    - images/
    - files/
    - .nojekyll

format:
  html:
    template: template.html   # the page skeleton (top bar, photo, links)
    theme: none
    minimal: true
